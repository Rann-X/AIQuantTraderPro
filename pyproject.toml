[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quant-trader-pro"
version = "1.0.0"
description = "OKX public market research and isolated paper trading terminal"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "websockets>=15,<18", "pydantic>=2.11,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pandas>=2.2,<4", "numpy>=2,<3", "streamlit>=1.50,<2", "plotly>=6,<8", "tomli-w>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
quant-market = "quant.cli:main"
quant-paper = "quant.paper_cli:main"
quant-terminal = "quant.desktop:main"

[tool.setuptools.packages.find]
include = ["quant*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--basetemp=work/pytest"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
